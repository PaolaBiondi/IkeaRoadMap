<section class="link-sections" aria-labelledby="link-sections-title">
  <div class="section-heading">
    <p class="eyebrow">{{selectedDepartment?.description}} odjel {{selectedDepartment?.id}} </p>
    <h2 id="link-sections-title">{{selectedDepartment?.name}}</h2>
  </div>

  <div class="link-grid">
  @for (card of selectedLinkCards; track card.url) {
    <article class="link-card">
      <img [src]="card.image" [alt]="card.imageAlt" width="640" height="450" loading="lazy" />

      <div class="link-card-content">
        <a class="link-button" [href]="card.url" target="_blank"
          rel="noopener noreferrer">
          Source
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </article>
  }

        <article class="link-card">

</section>
