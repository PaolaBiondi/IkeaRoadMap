<div class="map-scroll">
  <div class="map">
  <img
    src="assets/ikea_zagreb_map.png"
    alt="Karta robne kuće s označenim odjelima"
  />

  <svg
    class="map-overlay"
    viewBox="0 0 1392 354"
    preserveAspectRatio="none"
    aria-label="Interaktivne zone IKEA karte"
  >
    <polygon
      class="hotspot"
      points="250,110 300,100 325,135 275,150"
      tabindex="0"
      role="button"
      aria-label="Odjel 12"
      (click)="openDepartment(12)"
      (keydown.enter)="openDepartment(12)"
      (keydown.space)="openDepartment(12); $event.preventDefault()"
    ></polygon>

    <polygon
      class="hotspot"
      points="700,265 740,250 770,280 735,315"
      tabindex="0"
      role="button"
      aria-label="Odjel 20"
      (click)="openDepartment(20)"
      (keydown.enter)="openDepartment(20)"
      (keydown.space)="openDepartment(20); $event.preventDefault()"
    ></polygon>
  </svg>

  </div>
</div>
